<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Getaway ☀️ — Sunny Destinations from Ireland</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>☀️ Getaway</h1>
    <p class="subtitle">Direct flights from Ireland &nbsp;·&nbsp; Pick a country to see its sunniest spots</p>
    <div class="header-meta">
        <div id="last-updated">Checking weather…</div>
        <button id="refresh-btn" onclick="manualRefresh()" title="Refresh now">↻ Refresh</button>
    </div>
</header>

<main>
    <div id="loading">
        <div class="spinner"></div>
        <p>Checking the weather across Europe…<small>This may take a minute on first load</small></p>
    </div>

    <div id="error">
        <div class="emoji">😕</div>
        <h2>Couldn't load weather data</h2>
        <p>Please try again later.</p>
    </div>

    <div id="country-grid"></div>
</main>

<script src="{{ url_for('static', filename='common.js') }}"></script>
<script src="{{ url_for('static', filename='home.js') }}"></script>
</body>
</html>
